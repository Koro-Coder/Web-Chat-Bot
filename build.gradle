plugins {
    id 'java'
    id 'java-library'
}

group = 'com.company'
version = '1.0.0'
description = 'Enterprise Conversation Protocol'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    
    // Jackson for optional JSON support
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.0'
    
    // Lombok for test utilities
    testImplementation 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.test {
    useJUnitPlatform()
}

tasks.jar {
    manifest {
        attributes 'Main-Class': 'com.company.conversation.protocol.examples.ProtocolExamples'
    }
}

javadoc {
    options {
        addStringOption 'Xdoclint:all'
    }
}

// Run examples task
task runExamples(type: JavaExec) {
    group = 'application'
    description = 'Run protocol examples'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.company.conversation.protocol.examples.ProtocolExamples'
}

